<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Maker Legal: an in-house legal AI workspace prototype by AI Maker House.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Maker Legal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tinos:ital,wght@0,400;0,700;1,400&family=Noto+Serif+SC:wght@400;600;700&display=swap">
<style>
/* Layout: brand header + left rail (stacks to top tabs on phones); each module is one working screen. AI Maker House palette. */
:root{
  --brand-black:#111111; --brand-orange:#F7941E; --brand-red:#E85D2A; --brand-brown:#7A3218;
  --bg:#F8F6F2; --glow:#F8E2DA; --grid:rgba(30,20,10,.035);
  --surface:#FFFFFF; --surface-2:#FFF3EA; --sunken:#F3EFEA;
  --ink:#0E0E0C; --muted:#6B655F; --faint:#99918A; --line:#EAE3DB; --line-strong:#D8CEC4;
  --accent:#E5602E; --accent-ink:#B4441A; --rust:#BA4B38;
  --btn:#0E0E0C; --btn-ink:#FFFFFF;
  --crit:#C1302A; --crit-bg:#FCE7E4; --high:#C95A16; --high-bg:#FDEDE0; --med:#946B00; --med-bg:#FAF1D6;
  --ok:#2C7650; --ok-bg:#E3F2E8; --info:#36659C; --info-bg:#E5EDF7; --none:#8A837C; --none-bg:#F1EDE8;
  --f-display:"Times New Roman",Times,Tinos,"Noto Serif SC","Songti SC",SimSun,serif;
  --f-body:"Times New Roman",Times,Tinos,"Noto Serif SC","Songti SC",SimSun,serif;
  --f-mono:"Times New Roman",Times,Tinos,"Noto Serif SC","Songti SC",SimSun,serif;
  --r:12px; --r-sm:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121110; --glow:#3A2017; --grid:rgba(255,240,230,.035);
  --surface:#1B1816; --surface-2:#2A1D16; --sunken:#171513;
  --ink:#F4EFE9; --muted:#AAA198; --faint:#7C746D; --line:#2D2824; --line-strong:#3E3631;
  --accent:#F27A47; --accent-ink:#F79A70; --rust:#DA7562;
  --btn:#F4EFE9; --btn-ink:#121110;
  --crit:#F2766E; --crit-bg:#3B1A18; --high:#F09A5B; --high-bg:#3A2314; --med:#E2BF55; --med-bg:#33290F;
  --ok:#64C190; --ok-bg:#14301F; --info:#86AEDF; --info-bg:#182538; --none:#8F8780; --none-bg:#24201D;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121110; --glow:#3A2017; --grid:rgba(255,240,230,.035);
  --surface:#1B1816; --surface-2:#2A1D16; --sunken:#171513;
  --ink:#F4EFE9; --muted:#AAA198; --faint:#7C746D; --line:#2D2824; --line-strong:#3E3631;
  --accent:#F27A47; --accent-ink:#F79A70; --rust:#DA7562;
  --btn:#F4EFE9; --btn-ink:#121110;
  --crit:#F2766E; --crit-bg:#3B1A18; --high:#F09A5B; --high-bg:#3A2314; --med:#E2BF55; --med-bg:#33290F;
  --ok:#64C190; --ok-bg:#14301F; --info:#86AEDF; --info-bg:#182538; --none:#8F8780; --none-bg:#24201D;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  background-image:radial-gradient(900px 520px at 12% 18%,var(--glow),transparent 70%),radial-gradient(700px 480px at 92% 70%,var(--glow),transparent 70%),
  linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:auto,auto,40px 40px,40px 40px;background-attachment:fixed;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:30px;font-weight:700;line-height:1.15}
h2{font-size:19px;font-weight:700}
h3{font-size:16px;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:13px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:16px;height:60px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);flex:none}
.brand svg{width:30px;height:auto;flex:none}
.brand b{font-family:var(--f-display);font-weight:700;font-size:17px}
.brand .sep{width:1px;height:18px;background:var(--line-strong)}
.brand .prod{font-weight:700;color:var(--accent)}
.top .co{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:0}
.co-chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line-strong);border-radius:10px;padding:6px 10px;background:var(--surface);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.co-chip i{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.ai-chip{font-size:12px;border-radius:999px;padding:4px 10px;background:var(--none-bg);color:var(--muted);white-space:nowrap}
.ai-chip.on{background:var(--ok-bg);color:var(--ok)}
.lang{flex:none;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:6px 12px;font-weight:700;font-size:14px;cursor:pointer;min-width:52px}
.lang:hover{border-color:var(--accent);color:var(--accent-ink)}

/* shell */
.shell{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 64px}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);align-self:start;display:flex;flex-direction:column;gap:2px}
.rail a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:500}
.rail a:hover{background:var(--surface);color:var(--ink)}
.rail a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.rail a .k{font-family:var(--f-mono);font-size:11px;color:var(--faint);width:18px}
.rail a[aria-current="page"] .k{color:var(--accent)}
.rail .badge{margin-left:auto;font-size:11px;background:var(--crit-bg);color:var(--crit);border-radius:999px;padding:0 7px;font-weight:700}
.rail-foot{margin-top:18px;padding:12px;border-radius:10px;border:1px dashed var(--line-strong);font-size:12px;color:var(--muted)}
main{min-width:0;display:flex;flex-direction:column;gap:20px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-head .lead{color:var(--muted);max-width:68ch;margin-top:6px}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.grid-5-7{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:20px}
.grid-8-4{display:grid;grid-template-columns:minmax(0,8fr) minmax(0,4fr);gap:20px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* buttons, inputs */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;background:var(--btn);color:var(--btn-ink);border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer;font-size:14px}
.btn:hover{opacity:.88}
.btn{white-space:nowrap;flex:none}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line-strong)}
.btn.accent{background:var(--accent);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:500}
input[type=text],input[type=number],select,textarea{background:var(--sunken);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;font-size:14px;width:100%}
textarea{resize:vertical;line-height:1.5}
.seg{display:inline-flex;background:var(--sunken);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:500;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-crit{background:var(--crit-bg);color:var(--crit)} .p-high{background:var(--high-bg);color:var(--high)}
.p-med{background:var(--med-bg);color:var(--med)} .p-low,.p-info{background:var(--info-bg);color:var(--info)}
.p-ok{background:var(--ok-bg);color:var(--ok)} .p-none{background:var(--none-bg);color:var(--none)}
.tag{display:inline-block;border:1px solid var(--line-strong);border-radius:6px;padding:0 6px;font-size:12px;color:var(--muted);white-space:nowrap}

/* tables */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num{white-space:nowrap}

/* hero (brand banner motif) */
.hero{position:relative;overflow:hidden;border-radius:16px;background:var(--brand-black);color:#F4EFE9;padding:26px 26px 22px;min-height:168px}
.hero::before{content:"";position:absolute;inset:0;background:var(--brand-brown);clip-path:polygon(44% 0,100% 0,100% 82%,96% 70%)}
.hero::after{content:"";position:absolute;inset:0;background:var(--brand-orange);clip-path:polygon(58% 0,100% 0,100% 64%,97% 56%)}
.hero > *{position:relative;z-index:1}
.hero h1{color:#fff;font-size:32px}
.hero p{color:#CFC8C0;max-width:56ch;margin-top:8px}
.hero .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:22px}
.kpi{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:12px 14px;backdrop-filter:blur(4px)}
.kpi .v{font-family:var(--f-display);font-size:28px;font-weight:700;color:#fff}
.kpi .l{font-size:13px;color:#BDB5AD}
.kpi .d{font-size:13px;margin-top:2px}
.kpi .d.bad{color:#FFB08A} .kpi .d.good{color:#9FDCB8}

/* alerts list */
.alert{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.alert:last-child{border-bottom:0}
.alert .bar{align-self:stretch;border-radius:4px}
.alert .t{font-weight:700}
.alert .s{font-size:13px;color:var(--muted)}

/* bars */
.bars{display:flex;flex-direction:column;gap:12px}
.bar-row{display:grid;grid-template-columns:170px minmax(0,1fr) 130px;gap:10px;align-items:center;font-size:14px}
.bar-row .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{position:relative;height:12px;background:var(--sunken);border-radius:6px;overflow:hidden}
.bar-fill{position:absolute;inset:0 auto 0 0;border-radius:6px;background:var(--brand-orange)}
.bar-fill.over{background:var(--crit)}
.bar-mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}

/* contract review */
.doc{background:var(--sunken);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;max-height:640px;overflow:auto;font-family:var(--f-mono);font-size:14.5px;line-height:1.7;white-space:pre-wrap}
.doc mark{background:var(--high-bg);color:inherit;border-bottom:2px solid var(--high);padding:0 1px;border-radius:2px}
.doc mark.crit{background:var(--crit-bg);border-color:var(--crit)}
.doc mark.flash{outline:2px solid var(--accent)}
.finding{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.finding .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.finding .why{font-size:14px;color:var(--muted)}
.redline{font-family:var(--f-mono);font-size:14px;background:var(--ok-bg);border-left:3px solid var(--ok);padding:8px 10px;border-radius:0 6px 6px 0;white-space:pre-wrap}
.quote{font-family:var(--f-mono);font-size:14px;background:var(--crit-bg);padding:6px 10px;border-radius:6px;text-decoration:line-through;text-decoration-color:var(--crit);text-decoration-thickness:1px}
.src-note{font-size:13px;border-radius:8px;padding:8px 10px;background:var(--info-bg);color:var(--info)}
.src-note.warn{background:var(--med-bg);color:var(--med)}
.thinking{display:flex;align-items:center;gap:10px;color:var(--muted);padding:16px 0}
.dot3{display:inline-flex;gap:4px}.dot3 i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:b 1.2s infinite}
.dot3 i:nth-child(2){animation-delay:.15s}.dot3 i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px}
.step .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--sunken);color:var(--muted)}
.step.done .n{background:var(--ok-bg);color:var(--ok)}
.step.rej .n{background:var(--crit-bg);color:var(--crit)}
.pb{display:grid;grid-template-columns:minmax(0,1.1fr) repeat(3,minmax(0,1fr)) auto;gap:0;font-size:13.5px}
.pb > div{padding:8px 10px;border-bottom:1px solid var(--line)}
.pb .h{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* compliance matrix */
.mx{display:grid;grid-template-columns:minmax(150px,1.3fr) repeat(4,minmax(110px,1fr));min-width:640px}
.mx > div{border-bottom:1px solid var(--line);padding:6px}
.mx .rh{font-weight:700;font-size:14px;display:flex;flex-direction:column;justify-content:center;padding-left:2px}
.mx .rh small{font-weight:400;color:var(--faint);font-size:12px}
.mx .ch{font-size:13px;font-weight:700;text-align:center;padding:8px 6px}
.mx .ch small{display:block;font-weight:400;color:var(--faint);font-size:12px}
.cell{width:100%;height:100%;min-height:44px;border-radius:8px;border:1px solid transparent;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;padding:6px 8px;text-align:left;font-size:13px;font-weight:700}
.cell:hover{border-color:var(--line-strong)}
.cell[aria-pressed="true"]{outline:2px solid var(--accent)}
.cell .st{font-size:11.5px;font-weight:400;opacity:.85}
.c-gap{background:var(--crit-bg);color:var(--crit)} .c-progress{background:var(--high-bg);color:var(--high)}
.c-review{background:var(--med-bg);color:var(--med)} .c-ok{background:var(--ok-bg);color:var(--ok)} .c-none{background:var(--none-bg);color:var(--none)}
.row-off{opacity:.35}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.toggle:last-child{border-bottom:0}
.sw{position:relative;width:36px;height:20px;flex:none;border-radius:999px;background:var(--line-strong);border:0;cursor:pointer}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{left:18px}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px 12px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.ai-out{white-space:pre-wrap;font-size:14px;background:var(--surface-2);border-radius:10px;padding:12px}

/* intake */
.chat{display:flex;flex-direction:column;gap:10px;max-height:460px;overflow:auto;padding:4px 2px}
.msg{max-width:88%;padding:10px 12px;border-radius:12px;font-size:14.5px;white-space:pre-wrap}
.msg.u{align-self:flex-end;background:var(--btn);color:var(--btn-ink);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:4px}
.msg .who{display:block;font-size:11px;font-weight:700;opacity:.7;margin-bottom:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:13px;cursor:pointer;text-align:left}
.chip:hover{border-color:var(--accent);color:var(--accent-ink)}
.board{display:grid;grid-template-columns:repeat(4,minmax(200px,1fr));gap:12px;overflow-x:auto;padding-bottom:4px}
.col{background:var(--sunken);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col h3{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.mcard.new{border-color:var(--accent)}
.mcard .id{font-family:var(--f-mono);font-size:12px;color:var(--faint)}
.triage{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px}

/* counsel */
.firm{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.firm:last-child{border-bottom:0}
.firm .nm{font-weight:700}
.firm .meta{font-size:13px;color:var(--muted)}
.inv td.flag{background:var(--crit-bg)}
.inv td.warnc{background:var(--med-bg)}
.flags{display:flex;flex-direction:column;gap:8px}
.flagi{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-size:14px}

/* upload */
.drop{border:2px dashed var(--line-strong);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;background:var(--sunken)}
.drop.over{border-color:var(--accent);background:var(--surface-2)}
.drop .hint{font-size:13px;color:var(--muted)}

/* radar */
.upd{border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.upd.focus{outline:2px solid var(--accent)}
.upd.new{border-left:4px solid var(--accent)}
.upd .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.upd .impact{font-size:14px;background:var(--surface-2);border-radius:8px;padding:8px 10px}
.cellchip{border:1px solid var(--line-strong);background:var(--sunken);border-radius:6px;padding:1px 8px;font-size:12px;cursor:pointer}
.cellchip:hover{border-color:var(--accent);color:var(--accent-ink)}
.newdot{font-size:11px;font-weight:700;color:var(--accent-ink)}
.cell .newdot{color:inherit}
.p-new{background:var(--high-bg);color:var(--accent-ink)}

function transferCheck(x){
  const steps=[]; let mech, ok, cite;
  if(x.from==="ON"){
    mech=T("无需充分性认定：合同保障 + 告知境外处理","No adequacy test: contractual safeguards + notice of foreign processing"); ok=true; cite="PIPEDA Principle 4.1.3";
    steps.push(T("与美国接收方签数据处理协议，约定相当的保护水平","Sign a data processing agreement with comparable protection"));
    steps.push(T("在隐私告知中说明数据可能在美国处理","Tell individuals their data may be processed in the US"));
    if(x.data==="sensitive"){ steps.push(T("敏感数据建议取得明示同意","Get express consent for sensitive data")); ok=false; }
    return {ok,mech,steps,cite};
  }
  const covered = x.rec==="dpf_hr";
  if(x.from==="EU"){
    cite="GDPR Art. 45–46";
    if(covered){ mech=T("充分性决定（欧美数据隐私框架 DPF）","Adequacy decision (EU-US Data Privacy Framework)"); ok=true; steps.push(T("每年确认 DPF 认证有效，且仍覆盖 HR 数据","Confirm each year that the DPF certification is active and covers HR data")); }
    else { mech=T("标准合同条款（SCCs）+ 传输影响评估","Standard Contractual Clauses (SCCs) + transfer impact assessment"); ok=false;
      steps.push(T("签署欧盟 SCCs（控制者到处理者用模块 2）","Sign the EU SCCs (Module 2, controller to processor)"));
      steps.push(T("完成并存档传输影响评估","Complete and file a transfer impact assessment"));
      if(x.rec==="dpf") steps.push(T("认证未覆盖 HR 数据：候选人和员工数据不能依赖 DPF（保守口径，需核实）","Certification excludes HR data, so candidate and worker data cannot rely on the DPF (conservative view; verify)")); }
  } else {
    cite="UK GDPR Art. 45–46";
    if(covered){ mech=T("英美数据桥（DPF 英国扩展）","UK-US data bridge (UK Extension to the DPF)"); ok=true; steps.push(T("确认接收方已加入 DPF 英国扩展","Confirm the recipient joined the UK Extension")); }
    else { mech=T("国际数据传输协议（IDTA）或 SCCs 英国附录 + 传输风险评估","IDTA or UK Addendum to the SCCs + transfer risk assessment"); ok=false;
      steps.push(T("签署 IDTA 或英国附录","Sign the IDTA or the UK Addendum")); steps.push(T("完成传输风险评估","Complete a transfer risk assessment")); }
  }
  if(x.data==="sensitive"){ steps.push(T("敏感数据另需第 9 条处理条件，并做数据保护影响评估（DPIA）","Sensitive data also needs an Article 9 condition and a DPIA")); ok=false; }
  steps.push(T("在隐私告知中列明跨境传输及保障措施","List the transfer and its safeguards in the privacy notice"));
  return {ok,mech,steps,cite};
}

async function pdfDoc(file){
  const lib=window.pdfjsLib; if(!lib) throw {code:"pdf_lib"};
  return await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
}
async function pdfText(doc){
  const pages=[];
  for(let i=1;i<=Math.min(doc.numPages,60);i++){ const tc=await (await doc.getPage(i)).getTextContent(); pages.push(tc.items.map(it=>(it.str||"")+(it.hasEOL?"\n":"")).join("")); }
  return pages.join("\n\n").replace(/[ \t]+\n/g,"\n").trim();
}
async function pdfPagesAsImages(doc,max){
  const blobs=[];
  for(let i=1;i<=Math.min(doc.numPages,max);i++){
    const page=await doc.getPage(i); const vp=page.getViewport({scale:1.6});
    const cv=document.createElement("canvas"); cv.width=Math.ceil(vp.width); cv.height=Math.ceil(vp.height);
    await page.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise;
    blobs.push(await new Promise(r=>cv.toBlob(r,"image/png")));
  }
  return blobs;
}
async function ocrImages(blobs){
  if(!sample) throw {code:"no_ai"};
  const lim=await sample.limits().catch(()=>null);
  if(!lim?.images) throw {code:"images_unavailable"};
  const n=Math.min(blobs.length, lim.images.maxCount||1);
  const {text}=await sample(`These images are consecutive pages of a contract (or a photo of one). Transcribe ALL of the contract text verbatim, in reading order, keeping clause numbers, headings and paragraph breaks. Do not summarize, translate or comment. If an image has no contract text, skip it. Output only the transcribed text.`,{images:blobs.slice(0,n),modelTier:"default"});
  return {text:text.trim(), used:n};
}
const UPLOAD_ERR = {pdf_lib:B("PDF 解析组件没有加载，请刷新页面后再试。","The PDF reader did not load. Refresh the page and try again."),no_ai:B("扫描件和图片需要 AI 识别，当前 AI 不可用。可以改用文字版 PDF，或直接粘贴文本。","Scans and images need AI, which is unavailable here. Use a text PDF or paste the text."),images_unavailable:B("当前的查看方式不支持向 AI 发送图片。可以改用文字版 PDF，或直接粘贴文本。","This view cannot send images to AI. Use a text PDF or paste the text."),unsupported:B("只支持 PDF、PNG、JPG、WebP 文件。","Only PDF, PNG, JPG and WebP files are supported."),too_big:B("文件超过 20 MB，请压缩后再上传。","The file is over 20 MB. Compress it and try again."),empty:B("没有识别出合同文字，请换一个更清晰的文件。","No contract text was found. Try a clearer file.")};
async function handleFile(file){
  if(!file) return;
  S.reviewErr="";
  const isPdf = file.type==="application/pdf" || /\.pdf$/i.test(file.name);
  const isImg = /^image\/(png|jpeg|webp)$/.test(file.type);
  S.upload={busy:true,name:file.name,msg:T("读取文件…","Reading the file…")}; render();
  try{
    if(!isPdf && !isImg) throw {code:"unsupported"};
    if(file.size>20*1024*1024) throw {code:"too_big"};
    let text="", msg="";
    if(isPdf){
      const doc=await pdfDoc(file);
      text=await pdfText(doc);
      if(text.replace(/\s/g,"").length>=200){
        msg=T(`已在浏览器内提取 ${doc.numPages} 页文字，共 ${text.length} 字符。请核对后点“AI 审查”。`,`Extracted text from ${doc.numPages} pages in your browser (${text.length} characters). Check it, then review with AI.`);
      } else {
        S.upload.msg=T("这是扫描版 PDF，正在交给 AI 识别…","This PDF is a scan; AI is reading it…"); render();
        const blobs=await pdfPagesAsImages(doc,MAX_OCR_PAGES);
        const r=await ocrImages(blobs); text=r.text;
        msg=T(`扫描版 PDF：AI 识别了 ${r.used}/${doc.numPages} 页。识别结果可能有误，请核对后再审查。`,`Scanned PDF: AI read ${r.used} of ${doc.numPages} pages. Check the text for errors before reviewing.`);
      }
    } else {
      S.upload.msg=T("AI 正在识别图片中的文字…","AI is reading the image…"); render();
      const r=await ocrImages([file]); text=r.text;
      msg=T("AI 已从图片识别文字。识别结果可能有误，请核对后再审查。","AI transcribed the image. Check the text for errors before reviewing.");
    }
    if(text.replace(/\s/g,"").length<40) throw {code:"empty"};
    S.texts.custom=text; S.customKind=guessKind(text); delete S.review.custom;
    S.upload={busy:false,name:file.name,msg};
  }catch(e){
    aiDown(e);
    S.upload={busy:false,name:file.name,err:true,msg:UPLOAD_ERR[e?.code]?tx(UPLOAD_ERR[e.code]):errMsg(e)};
  }
  render();
}
function bindUpload(){
  const drop=$("#drop"), inp=$("#fileIn"); if(!drop||!inp) return;
  $("#pickFile").onclick=()=>inp.click();
  inp.onchange=()=>handleFile(inp.files[0]);
  drop.addEventListener("dragover",e=>{e.preventDefault();drop.classList.add("over")});
  drop.addEventListener("dragleave",()=>drop.classList.remove("over"));
  drop.addEventListener("drop",e=>{e.preventDefault();drop.classList.remove("over");handleFile(e.dataTransfer.files[0])});
}

function highlightDoc(text, findings){
  let h=esc(text);
  if(!findings) return h;
  findings.forEach((f,i)=>{
    const q=esc(f.quote||"").trim(); if(q.length<12) return;
    const idx=h.indexOf(q); if(idx<0) return;
    h=h.slice(0,idx)+`<mark id="q${i}" class="${f.severity==="critical"?"crit":""}">`+q+"</mark>"+h.slice(idx+q.length);
  });
  return h;
}
function approvalChain(findings){
  const steps=[]; const add=(r,why)=>{ if(!steps.find(s=>s.r===r)) steps.push({r,why}) };
  add("ops",T("初审确认 AI 结果","Confirm the AI review"));
  for(const f of findings){ if(f.tier!=="walk_away") continue;
    if(f.severity==="critical"){ add("gc",T(`${f.clause} 突破底线（致命）`,`${f.clause} breaches walk-away (critical)`)); add("ceo",T("存在致命级底线突破","Critical walk-away breach present")) }
    else if(f.severity==="high") add("gc",T(`${f.clause} 突破底线（高）`,`${f.clause} breaches walk-away (high)`));
  }
  for(const f of findings){ const a=String(f.approver||""); if(f.tier==="ideal") continue;
    if(/CFO/.test(a)) add("cfo",T(`${f.clause} 付款 / 资金条款`,`${f.clause} payment / funding terms`));
    if(/VP Sales/.test(a)) add("sales",T(`${f.clause} 商务条款`,`${f.clause} commercial terms`));
    if(/CEO/.test(a)) add("ceo",T(`${f.clause} 低于报价底线`,`${f.clause} below pricing floor`));
  }
  const order=["ops","sales","cfo","gc","ceo"];
  return steps.sort((a,b)=>order.indexOf(a.r)-order.indexOf(b.r));
}

function reviewPrompt(text, pbk){
  const pb=PLAYBOOKS[pbk];
  return `You are assisting the in-house legal team of ${CO.name}, a US company that provides Employer of Record (EOR) services and executive search. HQ: California. Employees in CA, NY, TX, IL. ${CO.tools}
We are the ${pbk==="eor"?"Provider (the EOR / legal employer)":"Agency (the recruiting firm)"}. The counterparty drafted the contract below.

Review the contract against OUR PLAYBOOK. For each playbook position, decide where the contract lands:
- "ideal": meets our ideal position (do NOT include these in the output)
- "acceptable": within our acceptable range
- "walk_away": breaches our walk-away line
- "missing": the contract has no clause on a position that matters
Apply US law (federal and the relevant state law). Do not invent facts about the parties.

PLAYBOOK (JSON):
${JSON.stringify(pb.map(p=>({id:p.id,topic:p.topic.en,severity:p.sev,ideal:p.ideal.en,acceptable:p.acceptable.en,walk_away:p.walk.en,approver:p.auth.en})))}

CONTRACT:
"""
${text.slice(0,24000)}
"""

Reply with ONLY a JSON array. Each item:
{"playbook_id": string (from the playbook), "clause": "§N" or "missing", "tier": "acceptable"|"walk_away"|"missing", "severity": "critical"|"high"|"medium"|"low", "quote": exact verbatim excerpt (<=200 chars) copied from the contract, or "" if missing, "issue": one-line summary in ${outLang()} (short), "why": 1-2 sentences in ${outLang()} explaining the risk to us, citing specific US statutes where relevant, "redline": replacement clause in English that would meet our ideal or acceptable position, "approver": the approver from the playbook (in English)}
Order by severity, most severe first.`;
}
async function runReview(){
  const ct=S.ctype; const pbk=pbKey(ct);
  if(ct==="custom"){ S.texts.custom=$("#customText")?.value||""; if(S.texts.custom.trim().length<80){ S.reviewErr=T("请先粘贴至少几段合同文本。","Paste at least a few paragraphs of contract text first."); render(); return } }
  S.reviewErr="";
  if(!sample){
    if(ct==="custom"){ S.reviewErr=T("AI 不可用，自定义合同无法审查。可以切换到两份示例合同查看预置结果。","AI is unavailable, so a custom contract cannot be reviewed. Switch to a sample contract to see a preset review."); render(); return }
    S.review[ct]={findings:PRESET[ct],source:"preset"}; S.approvals[ct]={}; render(); return;
  }
  S.reviewing=true; S.reviewCtl=new AbortController(); render();
  try{
    const out=await sample.json(reviewPrompt(S.texts[ct],pbk),{signal:S.reviewCtl.signal,modelTier:"default"});
    const arr=(Array.isArray(out)?out:[]).filter(f=>f&&typeof f==="object"&&f.tier!=="ideal").map(f=>({
      playbook_id:String(f.playbook_id||""),clause:String(f.clause||""),tier:TIER[f.tier]?f.tier:"walk_away",severity:SEV[f.severity]?f.severity:"medium",
      quote:String(f.quote||""),issue:String(f.issue||""),why:String(f.why||""),redline:String(f.redline||""),approver:String(f.approver||"")}));
    if(!arr.length) throw {code:"empty_completion"};
    S.review[ct]={findings:arr,source:"ai"}; S.approvals[ct]={};
  }catch(e){
    if(e?.code!=="cancelled"){ aiDown(e); S.reviewErr=errMsg(e);
      if(ct!=="custom"&&!S.review[ct]) S.review[ct]={findings:PRESET[ct],source:"preset"}; }
  }finally{ S.reviewing=false; S.reviewCtl=null; render(); }
}
function bindContracts(){
  document.querySelectorAll("[data-ct]").forEach(b=>b.onclick=()=>{ if(S.reviewing) return; S.ctype=b.dataset.ct; ls.set("ctype",S.ctype); S.reviewErr=""; render() });

}

function triageRules(d){
  const txt=(d.title+" "+d.desc).toLowerCase(); const r=[]; let type="general",pri="low",sla=T("72 小时","72 h"),owner=T("法务（综合）","Legal (general)"),ext=false;
  const hit=(re,why)=>{ if(re.test(txt)){ r.push(why); return true } return false };
  if(hit(/起诉|诉讼|仲裁|paga|demand letter|律师函|lawsuit|arbitration|eeoc|sue\b/,T("命中「诉讼 / 仲裁 / PAGA」关键词","Matched litigation / arbitration / PAGA keywords"))){type="dispute";pri="crit";sla=T("4 小时","4 h");owner=T("法务负责人","General Counsel");ext=true}
  else if(hit(/解雇|辞退|terminat|裁员|layoff|\bfire|dismiss/,T("命中「解雇」关键词","Matched termination keywords"))){type="employment";pri="high";sla=T("24 小时","24 h");owner=T("法务（雇佣）","Legal (employment)")}
  else if(hit(/签证|h-1b|h1b|i-9|绿卡|perm|visa|green card/,T("命中「签证 / 移民」关键词","Matched visa / immigration keywords"))){type="immigration";pri="med";sla=T("72 小时","72 h");owner=T("法务（雇佣）","Legal (employment)");ext=true}
  else if(hit(/合同|协议|msa|sow|nda|dpa|agreement|contract/,T("命中「合同」关键词","Matched contract keywords"))){type="contract";pri="med";sla=T("48 小时","48 h");owner=T("法务（商务）","Legal (commercial)")}
  else if(hit(/隐私|数据|bipa|gdpr|跨境|欧盟|英国|德国|加拿大|指纹|\bai\b|偏见|审计|合规|privacy|data|biometric|fingerprint|bias|audit|compliance|cross-border|\beu\b|\buk\b|germany|canada/,T("命中「合规 / 数据 / AI」关键词","Matched compliance / data / AI keywords"))){type="compliance";pri="med";sla=T("48 小时","48 h");owner=T("法务（合规）","Legal (compliance)")}
  const amt=Number(d.amount)||0;
  if(amt>=100000){ r.push(T(`金额 ${money(amt)} ≥ $100,000，优先级上调`,`Amount ${money(amt)} ≥ $100,000: priority raised`)); if(pri==="low"||pri==="med") pri="high" }
  if(d.state==="CA"&&type==="employment"){ r.push(T("加州雇佣事务：解雇当日须结清工资，期限压缩为 12 小时","California employment matter: final pay is due on the termination day, so the deadline drops to 12 h")); sla=T("12 小时","12 h"); if(pri!=="crit") pri="high" }
  if(ext) r.push(T("建议使用外部律所（见模块 04）","Consider outside counsel (see Module 04)"));
  if(!r.length) r.push(T("未命中特定规则，按一般咨询处理","No specific rule matched; handled as a general question"));
  return {type,pri,sla,owner,ownerId:TYPE_OWNER[type],rules:r};
}

        <ul style="margin:0;padding-left:18px;font-size:14px">${S.triage.rules.map(r=>`<li>${esc(r)}</li>`).join("")}</ul>
        <p class="faint" style="font-size:13px">${esc(T(`已生成事项 ${S.triage.id}，见下方看板。`,`Created matter ${S.triage.id}; see the board below.`))}</p></div>`:""}
      ${S.triageBusy?`<div class="thinking"><span class="dot3"><i></i><i></i><i></i></span>${esc(T("AI 正在检查…","AI is checking…"))}</div>`:""}
      ${S.triageAi?`<div class="triage"><b>${esc(T("AI 建议补问","AI suggests asking"))}</b><p style="font-size:14px">${esc(S.triageAi.summary||"")}</p><ul style="margin:0;padding-left:18px;font-size:14px">${(S.triageAi.questions||[]).map(q=>`<li>${esc(q)}</li>`).join("")}</ul>${S.triageAi.risk?`<p class="src-note warn">${esc(S.triageAi.risk)}</p>`:""}</div>`:""}
    </section>
  </div>
  <section class="card">
    <div class="card-h"><h2>${esc(T("事项看板","Matter board"))}</h2><span class="faint" style="font-size:13px">${esc(T("业务方可实时看到进度","Requesters see progress live"))}</span></div>
    <div class="board">${cols.map(c=>{const ms=S.matters.filter(m=>m.status===c);return `<div class="col"><h3>${esc(tx(MSTATUS[c]))}<span>${ms.length}</span></h3>${ms.map(m=>`<div class="mcard ${S.newIds.includes(m.id)?"new":""}"><span class="id">${m.id} · ${esc(tx(DEPT[m.dept]))} · ${m.state}</span><b>${esc(tx(m.t))}</b><span class="row" style="gap:6px">${pill(PRI[m.pri])}<span class="tag">${esc(tx(TYPE[m.type]))}</span><span class="faint mono" style="font-size:12px">${md(m.due)}</span></span><span class="faint" style="font-size:12.5px">${esc(pocLine(m.req,m.owner))}</span>${m.firm?`<span class="faint" style="font-size:13px">${esc(T("外包：","Counsel: "))}${esc(m.firm)}</span>`:""}</div>`).join("")||`<span class="faint" style="font-size:13px">${esc(T("暂无","None"))}</span>`}</div>`}).join("")}</div>
  </section>`;
}
function chatContext(){
  const lines=[];
  for(const R of Object.values(REGIONS)) for(const s of R.cols) for(const t of R.topics){ const c=R.mx[s.k][t.k]; lines.push(`[${s.k}-${tx(t.n)}] ${tx(c.rule)} (${T("依据","source")}: ${tx(c.cite)}; ${T("状态","status")}: ${tx(STATUS[c.s][0])}${c.note?"; "+tx(c.note):""})`) }
  return `You are the AI assistant for the legal team of ${CO.name}, answering questions from recruiters and account managers. Company: ${CO.biz.en}, HQ California, workers in CA, NY, TX, IL; EOR workers in the UK and Ontario; Germany launching; sources candidates from the EU. ${CO.tools}
Rules:
- Answer ONLY from the company policies, compliance matrix and federal baseline below. End each claim with its source in square brackets, e.g. [LP-04] or [CA-${tx(TOPICS[4].n)}].
- If the sources are not enough, the question involves a specific dispute, or it needs legal judgment, say clearly that they should submit a request to Legal. Do not guess.
- Reply in ${outLang()}. Give the conclusion first, then 2–4 concrete steps. Keep it under ${L==="en"?"120 words":"180 Chinese characters"}. No Markdown headings or bold.
- This is internal guidance, not legal advice.

Legal POCs by matter type (tell people whom to contact when they must go to Legal): contracts ${plEn("priya")}; employment and immigration ${plEn("marcus")}; privacy and compliance ${plEn("elena")}; disputes and litigation ${plEn("dana")}; anything else ${plEn("sam")}.

Company policies:
${POLICIES.map(p=>`[${p[0]}] ${tx(p[1])}`).join("\n")}

Compliance matrix:
${lines.join("\n")}

Federal baseline:
${FEDERAL.map(f=>`[${T("联邦","Federal")}-${f[0]}] ${tx(f[1])} (${f[2]})`).join("\n")}`;
}
async function ask(q){
  if(!sample||S.chatBusy||!q.trim()) return;
  S.chat.push({role:"user",content:q.trim()}); S.chatBusy=true; S.chatErr=""; render(); scrollChat();
  try{
    const turns=[{role:"user",content:chatContext()},...S.chat.slice(-8)];
    const {text}=await sample(turns,{cache:false,modelTier:"quick",onText:({text})=>{const el=$("#streaming");if(el){el.innerHTML=`<span class="who">Maker Legal</span>`+esc(text);scrollChat()}}});
    S.chat.push({role:"assistant",content:text});
  }catch(e){ aiDown(e); S.chatErr=errMsg(e); if(e?.text) S.chat.push({role:"assistant",content:e.text+T("（中断）"," (interrupted)")}) }
  finally{ S.chatBusy=false; render(); scrollChat() }
}
function scrollChat(){ const c=$("#chat"); if(c) c.scrollTop=c.scrollHeight }
function readIntake(){ const req=$("#inReq").value; return {req,dept:PEOPLE[req].dept,state:$("#inState").value,title:$("#inTitle").value.trim(),desc:$("#inDesc").value.trim(),amount:$("#inAmt").value} }
function saveForm(){ S.form={...readIntake(),lang:L,pristine:false} }
function bindIntake(){
  scrollChat();
  document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{ if(sample) ask(b.dataset.q); else { const i=$("#chatIn"); if(i) i.value=b.dataset.q } });
  $("#chatForm").onsubmit=e=>{e.preventDefault();ask($("#chatIn").value)};
  $("#clearChat")&&($("#clearChat").onclick=()=>{S.chat=[];S.chatErr="";render()});
  ["#inReq","#inState","#inTitle","#inDesc","#inAmt"].forEach(s=>$(s).addEventListener("input",saveForm));
  $("#intakeForm").onsubmit=e=>{e.preventDefault(); saveForm(); const d=readIntake(); if(!d.title){$("#inTitle").focus();return}
    const tr=triageRules(d); const id="M-"+(1050+S.newIds.length);
    const due=new Date(TODAY.getTime()+(tr.pri==="crit"?1:tr.pri==="high"?2:5)*86400000).toISOString().slice(0,10);
    S.matters.unshift({id,req:d.req,owner:tr.ownerId,t:d.title,type:tr.type,dept:d.dept,pri:tr.pri,status:"new",due,state:d.state}); S.newIds.push(id);
    S.triage={...tr,id,req:d.req}; render() };
  $("#aiTriage")&&($("#aiTriage").onclick=async()=>{ saveForm(); const d=readIntake(); S.triageBusy=true; S.triageAi=null; render();
    try{ S.triageAi=await sample.json(`You triage requests for the legal team of a US EOR and recruiting company.
Requester: ${plEn(d.req)}, team ${DEPT[d.dept].en}; state: ${d.state}; title: ${d.title}; details: ${d.desc}; amount: ${d.amount||"not given"}
Reply with ONLY JSON, all text in ${outLang()}: {"summary": one-sentence summary of the request, "questions": array of 2-4 specific questions Legal needs answered before acting, "risk": the single most important legal risk (may cite a US state or federal law), or "" if none}`,{modelTier:"quick"}) }
    catch(e){ aiDown(e); S.triageAi={summary:errMsg(e),questions:[]} }
    finally{ S.triageBusy=false; render() } });
}

/* ============ VIEW: COUNSEL ============ */
function lineAmt(l){ return l.amt!=null?l.amt:l.rate*l.h }
function precheck(){
  const flags={}; const add=(i,cls)=>{flags[i]=flags[i]==="flag"?"flag":cls};
  const perDay={};
  INVOICE.lines.forEach((l,i)=>{
    if(l.role!=="Expense"&&l.rate>OCG.rates[l.role]) add(i,"flag");
    if(l.role==="Expense"&&/business class/i.test(l.desc)) add(i,"flag");
    if(l.act==="A110"&&l.role!=="Paralegal") add(i,"flag");
    if((l.desc.match(/;/g)||[]).length>=2) add(i,"warnc");
    if(l.h){ const k=l.d+l.tk; perDay[k]=(perDay[k]||0)+l.h }
  });
  INVOICE.lines.forEach((l,i)=>{ if(l.h&&perDay[l.d+l.tk]>OCG.maxDay) add(i,"warnc") });
  return flags;
}
const roleLabel = r => ({Partner:T("合伙人","Partner"),Associate:T("律师","Associate"),Paralegal:T("律师助理","Paralegal"),Expense:T("费用","Expense")})[r]||r;
function vCounsel(){
  const total=INVOICE.lines.reduce((a,l)=>a+lineAmt(l),0); const pf=precheck(); const inv=S.inv;
  return `
  <div class="page-head"><div><span class="eyebrow">${esc(T("模块 04","Module 04"))}</span><h1>${esc(T("外部律所管理","Outside counsel"))}</h1>
  <p class="lead">${esc(T("管理合作律所、委托事项和预算。律所账单先按外部律所指引（OCG）做规则预检，再由 AI 逐行审查，给出核减建议。","Manage panel firms, engagements and budgets. Invoices get a rules-based check against the Outside Counsel Guidelines (OCG), then a line-by-line AI review with recommended cuts."))}</p></div></div>
  <div class="grid-5-7">
    <section class="card">
      <div class="card-h"><h2>${esc(T("合作律所","Panel firms"))}</h2><span class="faint" style="font-size:13px">${esc(T(`${FIRMS.length} 家 · 年初至今`,`${FIRMS.length} firms · YTD`))}</span></div>
      ${FIRMS.map(f=>{const over=f.spent>f.budget;return `<div class="firm"><span class="nm">${esc(f.n)}</span><span class="num mono" style="text-align:right;${over?"color:var(--crit)":""}">${money(f.spent)}</span>
        <span class="meta">${esc(tx(f.area))} · ${esc(tx(f.rates))}${f.note?" · "+esc(tx(f.note)):""}</span><span class="meta num" style="text-align:right">${esc(T("预算 ","Budget "))}${money(f.budget)}</span>
        <span class="meta">${esc(T("内部对接：","Internal POC: "))}${esc(pn(f.poc))} · ${f.matters.length?esc(T("在办：","Active: "))+f.matters.join(", "):esc(T("当前无在办事项","No active matters"))} · ${esc(T("评分","Rating"))} ${f.score}/5</span><span class="meta" style="text-align:right">${Math.round(f.spent/f.budget*100)}%</span></div>`}).join("")}
    </section>
    <section class="card">
      <div class="card-h"><h2>${esc(T("外部律所指引（OCG）","Outside Counsel Guidelines"))}</h2><span class="tag">${esc(T("适用于全部合作律所","Applies to all firms"))}</span></div>
      <ul style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px">${OCG.rules.map(r=>`<li>${esc(tx(r))}</li>`).join("")}</ul>
      <h3 style="margin-top:18px">${esc(T("预算与支出","Budget vs. spend"))}</h3><div style="margin-top:10px">${spendBars()}</div>
    </section>
  </div>
  <section class="card">
    <div class="card-h"><div><h2>${esc(T("账单审查 · ","Invoice review · "))}${esc(INVOICE.no)}</h2><span class="faint" style="font-size:13px">${esc(INVOICE.firm)} · ${esc(tx(INVOICE.matter))} · ${esc(INVOICE.period)}</span></div>
      <div class="row"><span class="num mono">${esc(T("合计 ","Total "))}${money(total)}</span><button class="btn accent" id="runInv" ${S.invBusy?"disabled":""}>${esc(sample?T("AI 逐行审查","Review with AI"):T("查看预置审查结果","Show preset review"))}</button></div></div>
    <div class="tbl-wrap"><table class="inv">
      <thead><tr><th>#</th><th>${esc(T("日期","Date"))}</th><th>${esc(T("人员","Timekeeper"))}</th><th class="num">${esc(T("费率","Rate"))}</th><th class="num">${esc(T("小时","Hours"))}</th><th>UTBMS</th><th>${esc(T("工作描述","Description"))}</th><th class="num">${esc(T("金额","Amount"))}</th></tr></thead>
      <tbody>${INVOICE.lines.map((l,i)=>`<tr><td class="mono">${i+1}</td><td class="mono num">${l.d}</td><td>${esc(l.tk)}<br><span class="faint" style="font-size:13px">${esc(roleLabel(l.role))}</span></td>
        <td class="num mono ${l.rate&&l.rate>OCG.rates[l.role]?"flag":""}">${l.rate?money(l.rate):"—"}</td><td class="num mono">${l.h??"—"}</td><td class="mono num">${l.task} ${l.act}</td>
        <td class="${pf[i]||""}" style="min-width:220px">${esc(l.desc)}</td><td class="num mono">${money(lineAmt(l))}</td></tr>`).join("")}</tbody>
    </table></div>
    <p class="faint" style="font-size:13px;margin-top:8px">${esc(T("红色 / 黄色底色是规则预检结果（不需要 AI）：费率超上限、行政事务、差旅超标、打包计时、单日超时。","Red and yellow cells come from the rules check (no AI): rate over cap, clerical work, travel over policy, block billing, long days."))}</p>
    ${S.invBusy?`<div class="thinking"><span class="dot3"><i></i><i></i><i></i></span>${esc(T("AI 正在对照 OCG 逐行审查…","The AI is checking each line against the OCG…"))}</div>`:""}
    ${S.invErr?`<p class="src-note warn" style="margin-top:10px">${esc(S.invErr)}</p>`:""}
    ${inv?invResult(inv,total):""}
  </section>`;
}
function invResult(inv,total){
  const cut=inv.items.reduce((a,f)=>a+(Number(f.cut)||0),0);
  return `<div style="margin-top:16px" class="stack">
    <div class="row" style="justify-content:space-between"><h3>${esc(inv.source==="ai"?T("AI 审查意见","AI review"):T("预置审查意见（未调用 AI）","Preset review (no AI call)"))}</h3>
      ${cut?`<span class="num mono">${esc(T("建议核减 ","Recommended cut "))}${money(cut)} · ${esc(T("建议支付 ","Pay "))}${money(total-cut)}</span>`:""}</div>
    <div class="flags">${inv.items.map(f=>`<div class="flagi">${pill(SEV[f.sev]||SEV.medium)}<span><b>${esc(T(`第 ${f.line} 行 · `,`Line ${f.line} · `))}${esc(tx(f.rule))}</b><br>${esc(tx(f.issue))}<br><span class="faint">${esc(tx(f.fix))}</span></span><span class="num mono">${f.cut?"−"+money(f.cut):""}</span></div>`).join("")}</div>
    <p class="faint" style="font-size:13px">${esc(T("核减需由法务确认后发给律所；律所可在 15 天内提出异议。","Legal confirms cuts before sending them to the firm; the firm has 15 days to dispute."))}</p></div>`;
}
const presetInv = ()=>({source:"preset",items:PRESET_INVOICE});
async function runInv(){
  S.invErr="";
  if(!sample){ S.inv=presetInv(); render(); return }
  S.invBusy=true; render();
  try{
    const out=await sample.json(`You review law-firm invoices for the in-house legal team of a US EOR / recruiting company.
Outside Counsel Guidelines (OCG):
${OCG.rules.map(r=>"- "+r.en).join("\n")}
Rate caps: Partner $650/h, Associate $425/h, Paralegal $225/h. Economy airfare reference SFO–LAX: about $250.

Invoice ${INVOICE.no} from ${INVOICE.firm}, matter ${INVOICE.matter.en}:
${INVOICE.lines.map((l,i)=>`${i+1}. ${l.d} | ${l.tk} (${l.role}) | rate ${l.rate??"-"} | hours ${l.h??"-"} | ${l.task} ${l.act} | ${l.desc} | amount ${lineAmt(l)}`).join("\n")}

Find every OCG violation or billing concern. Reply with ONLY a JSON array; each item:
{"line": line number, "sev": "high"|"medium"|"low", "rule": short rule name in ${outLang()}, "issue": what is wrong, in ${outLang()} (short), "fix": the recommended action in ${outLang()}, "cut": recommended reduction in USD as a number (0 if you recommend holding payment or asking for clarification instead)}
Compute reductions precisely from rate x hours, and do not cut the same dollars twice.`,{modelTier:"default"});
    const items=(Array.isArray(out)?out:[]).filter(x=>x&&x.line).map(x=>({line:String(x.line),sev:SEV[x.sev]?x.sev:"medium",rule:String(x.rule||""),issue:String(x.issue||""),fix:String(x.fix||""),cut:Number(x.cut)||0}));
    if(!items.length) throw {code:"empty_completion"};
    S.inv={source:"ai",items};
  }catch(e){ aiDown(e); S.invErr=errMsg(e); if(!S.inv) S.inv=presetInv() }
  finally{ S.invBusy=false; render() }
}
function bindCounsel(){ $("#runInv").onclick=runInv }

/* boot */
if(location.hash==="#radar") S.scope="radar";
render(); initAI();
</script>
